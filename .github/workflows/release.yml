name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-13, target: bun-darwin-x64, asset: oddjob-macos-x64 }
          - { os: macos-14, target: bun-darwin-arm64, asset: oddjob-macos-arm64 }
          - { os: ubuntu-22.04, target: bun-linux-x64, asset: oddjob-linux-x64 }
          - { os: ubuntu-22.04-arm, target: bun-linux-arm64, asset: oddjob-linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Pre-compile Tailwind CSS
        run: bun run --cwd apps/dashboard build:css

      - name: Build binary
        run: |
          mkdir -p dist
          bun build \
            --compile \
            --target=${{ matrix.target }} \
            --outfile=./dist/${{ matrix.asset }} \
            ./apps/cli/src/index.ts

      - name: Smoke test (native)
        run: ./dist/${{ matrix.asset }} --version

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/${{ matrix.asset }}
          fail_on_unmatched_files: true

      - name: Upload workflow_dispatch artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ./dist/${{ matrix.asset }}
