slug = "env-local-strict"
name = "Local strict environments"
description = "Seatbelt (macOS), bubblewrap (Linux), AppContainer (Windows). Restricts FS writes to workdir + per-session meta. Reads: Mac uses broad-allow + targeted-deny for /tmp /Users /opt /Library/Keychains and other exfil-prone roots; Linux bwrap ro-binds /usr/etc/lib only. Denies host env passthrough; egress policy enforced by the credential-broker proxy (see SECURITY.md)."
version = "0.1.0"
author = "Oddjob"
entry = "src/index.ts"

