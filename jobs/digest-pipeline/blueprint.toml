name = "digest-pipeline"
version = "0.1.0"
description = "Script-mode pipeline that fans out to fetcher → summarizer → joiner subblueprints. Demo for B2.3 ctx.fork + B2.4 replay engine."
author = "demo"
tags = ["script-mode", "fork", "demo"]
license = "MIT"

# Script-mode: main.ts is the entry point. The agent loop is bypassed —
# `defineRun` from @oddjob/sdk drives the run via the Context API.
[entry]
runtime = "bun"
file = "main.ts"
